name: NiteOwlCounter
options:
  bundleIdPrefix: dev.niteowl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  NiteOwlCounter:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NiteOwl Counter
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.niteowl.counter.oauth
            CFBundleURLSchemes:
              - dev.niteowl.counter
        CounterKeychainAccessGroup: $(AppIdentifierPrefix)dev.niteowl.counter.shared
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    entitlements:
      path: App/NiteOwlCounter.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.niteowl.counter
        PRODUCT_NAME: NiteOwlCounter
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CounterWidget
        embed: true

  CounterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Counter
        CounterKeychainAccessGroup: $(AppIdentifierPrefix)dev.niteowl.counter.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CounterWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.niteowl.counter.widget
        PRODUCT_NAME: CounterWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
